services:
  database:
    image: "postgres:17"
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: default_database
    volumes:
      - ./db-data/:/var/lib/postgresql/data/

  redis:
    image: "redis:7-alpine"
    ports:
      - 6379:6379
    volumes:
      - ./redis-data/:/data
    command: redis-server --appendonly yes
